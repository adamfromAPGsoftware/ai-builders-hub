<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Process Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
<!--
  AI Builders Hub process map. One template for every module intake.
  Fill it with scripts/fill_map.py (map JSON -> this file); never edit the layout per business.
  The data lives in the <script id="map-data"> block at the bottom. Fields: README.md.
  Deliberately one dark look (the Hub's lime on black), so colours are set once on :root.
-->
<style>
:root{
  --bg:#0d0d0d; --surface:#121212; --surface2:#191919; --border:#2a2a2a;
  --lime:#90f23c; --lime-ink:#0d0d0d; --lime-soft:rgba(144,242,60,.10);
  --text:#ffffff; --body:#a6a6a6; --faint:#6e6e6e;
  --r:16px; --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
h1{font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.04;letter-spacing:-.01em;margin:8px 0 0;text-transform:uppercase;text-wrap:balance}
h2{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--body);margin:0 0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.14em;font-size:13px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:900;font-size:15px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--body);white-space:nowrap}
.chip.lime{border-color:var(--lime);color:var(--lime)}
.chip.solid{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:700}
.sub{color:var(--body);max-width:68ch;margin:14px 0 0;font-size:17px}
.biz{margin-top:6px;color:var(--body);font-size:15px}
.biz b{color:var(--text);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0 36px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;min-width:0}
.stat b{display:block;font-weight:900;font-size:clamp(24px,3.4vw,36px);line-height:1.1;color:var(--lime)}
.stat span{color:var(--body);font-size:14px}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.node:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--body);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface2)}
.legend i.l{border-color:var(--lime);background:var(--lime-soft)}
.legend i.a{background:var(--lime);border-color:var(--lime)}

.flow-box{overflow-x:auto;margin:0 -4px;padding:4px}
.flow{position:relative;display:grid;gap:72px 64px;justify-content:start;padding:8px 4px 8px}
.flow > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:relative;z-index:1;text-align:left;background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-height:150px;transition:border-color .15s,transform .15s}
.node:hover{border-color:var(--faint);transform:translateY(-2px)}
.node.flag{border-color:var(--lime);background:linear-gradient(var(--lime-soft),var(--lime-soft)),var(--surface)}
.node.active{box-shadow:0 0 0 3px var(--lime)}
.node .n{display:flex;align-items:center;justify-content:space-between;gap:8px}
.num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--body);flex:none}
.flag .num{border-color:var(--lime);color:var(--lime)}
.bang{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:900;font-size:14px}
.node h3{margin:0;font-size:17px;line-height:1.2;font-weight:700;text-wrap:balance}
.who{font-size:13px;color:var(--body)}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools .chip{font-size:11.5px;padding:2px 8px}
.clk{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;flex:none;align-self:center}
.chip .clk{width:12px;height:12px}
.time{margin-top:auto;font-size:13px;color:var(--body);display:flex;gap:6px;align-items:baseline}
.flag .time{color:var(--lime);font-weight:700}
.pain{font-size:13px;color:var(--text)}
.takes{position:absolute;top:-12px;right:12px;font-size:11px;padding:2px 9px}
.node.fork{border-style:dashed;background:var(--bg)}
.fork .num{border-radius:4px;transform:rotate(45deg)}
.fork .num span{transform:rotate(-45deg)}
.opt{border:1px solid var(--border);border-radius:10px;padding:7px 9px;font-size:13px;background:var(--surface)}
.opt b{display:block;font-size:13px}
.opt span{color:var(--body);font-size:12px}
.more{font-size:12px;color:var(--faint)}
.node:hover .more{color:var(--lime)}

.time-bar{margin-top:44px}
.tbar{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.tbar div{min-width:2px;border-right:2px solid var(--bg);background:var(--surface2)}
.tbar div.l{background:var(--lime)}
.tkeys{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--body)}
.tkeys b{color:var(--text)}
.first{margin-top:44px;border:1.5px solid var(--lime);border-radius:var(--r);padding:22px;background:linear-gradient(var(--lime-soft),var(--lime-soft)),var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.first h3{margin:6px 0 6px;font-size:24px;font-weight:900;text-transform:uppercase}
.first p{margin:0;color:var(--body);max-width:62ch}
.first .save{text-align:right}
.first .save b{display:block;font-size:30px;font-weight:900;color:var(--lime);line-height:1.1}
@media (max-width:640px){.first{grid-template-columns:1fr}.first .save{text-align:left}}
.park{margin-top:36px}
.park ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.park li{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.park li span{color:var(--body)}
footer{margin-top:48px;color:var(--faint);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ribbon{background:var(--surface2);border:1px dashed var(--faint);color:var(--body);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:20px}

/* the detail panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.panel{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:640px){.panel{top:auto;width:100%;height:84vh;border-left:0;border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding-left:env(safe-area-inset-left,0px)}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.x{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.pb{overflow-y:auto;padding:20px;flex:1}
.pb h3{margin:4px 0 10px;font-size:26px;line-height:1.15;font-weight:900;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sec{margin-top:18px}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--body)}
.sec p{margin:0}
.sec ul{margin:0;padding-left:18px}
.sec li{margin:3px 0}
.sec.bad li::marker{color:var(--lime)}
.src{margin-top:22px;font-size:13px;color:var(--faint);border-top:1px solid var(--border);padding-top:12px}
.pf{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
document.addEventListener('DOMContentLoaded',function(){
  var M = JSON.parse(document.getElementById('map-data').textContent);
  var app = document.getElementById('app');
  var steps = M.steps || [];
  var takes = (M.first_skill && M.first_skill.takes_over) || [];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function list(a){return (a&&a.length)?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}

  document.title = (M.business ? M.business+' · ' : '') + (M.module ? M.module.name+' map' : 'Process map');

  var h = '';
  h += '<div class="top"><div class="brand"><div class="mark">AIB</div>AI BUILDERS HUB</div>';
  if (M.module) h += '<span class="chip lime">Module '+esc(M.module.n)+' · '+esc(M.module.name)+'</span>';
  h += '</div>';
  if (M.example) h += '<div class="ribbon">Example map. '+esc(M.business||'This business')+' is made up, and its rates are examples.</div>';
  h += '<div class="eyebrow">'+esc(M.module ? M.module.name+' map' : 'Process map')+'</div>';
  h += '<h1>'+esc(M.title||'How it works today')+'</h1>';
  if (M.business) h += '<div class="biz"><b>'+esc(M.business)+'</b>'+(M.trade?' · '+esc(M.trade):'')+'</div>';
  if (M.summary) h += '<p class="sub">'+esc(M.summary)+'</p>';
  if (M.before && M.before.length){
    h += '<div class="stats">'+M.before.slice(0,3).map(function(b){return '<div class="stat"><b>'+esc(b.value)+'</b><span>'+esc(b.label)+'</span></div>'}).join('')+'</div>';
  }
  h += '<div class="bar"><h2>The steps, in order</h2><div class="legend"><span><i class="l"></i>Where the time goes</span>'+(takes.length?'<span><i class="a"></i>Your assistant takes this</span>':'')+'</div>';
  h += '<button class="btn primary" id="walk">Walk through it →</button></div>';
  h += '<div class="flow-box"><div class="flow" id="flow"><svg id="lines" aria-hidden="true"></svg>';
  steps.forEach(function(s,i){
    var fork = s.type==='fork', flag = !!s.flag, take = takes.indexOf(s.id)>-1;
    h += '<button class="node'+(fork?' fork':'')+(flag?' flag':'')+'" data-i="'+i+'" aria-label="Step '+(i+1)+': '+esc(s.title)+'. Open the detail.">';
    if (take) h += '<span class="chip solid takes">Assistant takes this</span>';
    h += '<div class="n"><span class="num"><span>'+(i+1)+'</span></span>'+(flag?'<span class="bang" title="Where the time goes">!</span>':'')+'</div>';
    h += '<h3>'+esc(s.title)+'</h3>';
    if (s.who) h += '<div class="who">'+esc(s.who)+'</div>';
    if (fork){
      (s.options||[]).forEach(function(o){h += '<div class="opt"><b>'+esc(o.label)+'</b><span>'+esc(o.note||'')+'</span></div>'});
    } else {
      if (s.tools && s.tools.length) h += '<div class="tools">'+s.tools.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>';
      if (s.pain) h += '<div class="pain">'+esc(s.pain)+'</div>';
      if (s.time) h += '<div class="time"><svg class="clk" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>'+esc(s.time)+'</div>';
    }
    if (s.detail) h += '<div class="more">Tap for the detail</div>';
    h += '</button>';
  });
  h += '</div></div>';

  var timed = steps.filter(function(s){return s.minutes>0});
  if (timed.length){
    var total = timed.reduce(function(a,s){return a+s.minutes},0);
    var hm = function(m){return m>=60?Math.floor(m/60)+' h'+(m%60?' '+(m%60):''):m+' min'};
    h += '<div class="time-bar"><h2>Where one '+esc(M.per||'job')+'’s time goes · '+hm(total)+' hands-on</h2><div class="tbar" role="img" aria-label="Time per step">';
    timed.forEach(function(s){h += '<div class="'+(s.flag?'l':'')+'" style="flex:'+s.minutes+'" title="'+esc(s.title)+': '+esc(s.time)+'"></div>'});
    h += '</div><div class="tkeys">'+timed.map(function(s){return '<span><b>'+esc(s.title)+'</b> '+esc(hm(s.minutes))+'</span>'}).join('')+'</div></div>';
  }
  if (M.first_skill){
    var f = M.first_skill;
    var names = takes.map(function(id){var k=-1;steps.forEach(function(s,i){if(s.id===id)k=i});return k>-1?'step '+(k+1):''}).filter(Boolean);
    h += '<div class="first"><div><div class="eyebrow">Building first</div><h3>'+esc(f.name)+'</h3><p>'+esc(f.what||'')+(names.length?' Takes over '+(names.length>1?names.slice(0,-1).join(', ')+' and '+names[names.length-1]:names[0])+'.':'')+'</p></div>';
    if (f.saves) h += '<div class="save"><b>'+esc(f.saves)+'</b><span class="who">back, on our estimate</span></div>';
    h += '</div>';
  }
  if (M.parking && M.parking.length){
    h += '<div class="park"><h2>Still to find out</h2><ul>'+M.parking.map(function(p){return '<li>'+esc(p.question)+'<span>'+esc(p.who||'')+'</span></li>'}).join('')+'</ul></div>';
  }
  var nd=function(v){var d=new Date(v+'T00:00:00');return isNaN(d)?v:d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear()};
  h += '<footer><span>skool.com/ai-builders-hub</span><span>'+(M.updated?'Mapped '+esc(nd(M.updated)):'')+'</span></footer>';
  app.innerHTML = h;

  /* lay the boxes out in rows and draw the joining lines */
  var flow = document.getElementById('flow'), svg = document.getElementById('lines');
  var NW = 230;
  function layout(){
    var w = flow.parentNode.clientWidth - 8, gap = 64;
    var cols = Math.max(1, Math.min(steps.length, Math.floor((w + gap) / (NW + gap))));
    flow.style.rowGap = cols===1 ? '44px' : '';
    flow.style.gridTemplateColumns = 'repeat('+cols+', '+(cols===1?'minmax(0,'+Math.min(w,420)+'px)':NW+'px')+')';
    var nodes = [].slice.call(flow.querySelectorAll('.node'));
    var fr = flow.getBoundingClientRect();
    var R = nodes.map(function(n){var r=n.getBoundingClientRect();return {x:r.left-fr.left,y:r.top-fr.top,w:r.width,h:r.height}});
    svg.setAttribute('viewBox','0 0 '+fr.width+' '+fr.height);
    var p = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90f23c"/></marker></defs>';
    for (var i=0;i<R.length-1;i++){
      var a=R[i], b=R[i+1], d;
      if (Math.abs(a.y-b.y)<4){
        var y = a.y + Math.min(a.h,b.h)/2;
        d = 'M'+(a.x+a.w+4)+','+y+' L'+(b.x-6)+','+y;
      } else if (cols===1){
        d = 'M'+(a.x+a.w/2)+','+(a.y+a.h+4)+' L'+(b.x+b.w/2)+','+(b.y-6);
      } else {
        var midY = a.y + a.h + (b.y - a.y - a.h)/2;
        d = 'M'+(a.x+a.w/2)+','+(a.y+a.h+4)+' L'+(a.x+a.w/2)+','+midY+' L'+(b.x+b.w/2)+','+midY+' L'+(b.x+b.w/2)+','+(b.y-6);
      }
      p += '<path d="'+d+'" fill="none" stroke="#90f23c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)" opacity=".85"/>';
    }
    svg.innerHTML = p;
  }
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(flow.parentNode); else window.addEventListener('resize', layout);

  /* the detail panel, with Back and Next */
  var cur = -1, scrim, panel, lastFocus;
  function close(){
    if (!panel) return;
    panel.remove(); scrim.remove(); panel = scrim = null;
    [].forEach.call(flow.querySelectorAll('.node.active'),function(n){n.classList.remove('active')});
    if (lastFocus) lastFocus.focus();
  }
  function open(i){
    if (i<0||i>=steps.length) return;
    if (!panel){
      lastFocus = document.activeElement;
      scrim = document.createElement('div'); scrim.className='scrim'; scrim.onclick=close;
      panel = document.createElement('aside'); panel.className='panel'; panel.setAttribute('role','dialog'); panel.setAttribute('aria-modal','true');
      document.body.appendChild(scrim); document.body.appendChild(panel);
    }
    cur = i; var s = steps[i], d = s.detail||{};
    [].forEach.call(flow.querySelectorAll('.node'),function(n){n.classList.toggle('active',+n.dataset.i===i)});
    var meta = '';
    if (s.who) meta += '<span class="chip">'+esc(s.who)+'</span>';
    (s.tools||[]).forEach(function(t){meta += '<span class="chip">'+esc(t)+'</span>'});
    if (s.time) meta += '<span class="chip'+(s.flag?' lime':'')+'"><svg class="clk" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>'+esc(s.time)+'</span>';
    if (takes.indexOf(s.id)>-1) meta += '<span class="chip solid">Assistant takes this</span>';
    var b = '<div class="eyebrow">Step '+(i+1)+' of '+steps.length+(s.type==='fork'?' · a decision':'')+'</div><h3>'+esc(s.title)+'</h3><div class="meta">'+meta+'</div>';
    if (s.pain) b += '<div class="sec"><h4>Where the time goes</h4><p>'+esc(s.pain)+'</p></div>';
    if (d.what) b += '<div class="sec"><h4>What happens</h4><p>'+esc(d.what)+'</p></div>';
    if (s.type==='fork' && s.options) b += '<div class="sec"><h4>Which way it goes</h4>'+list(s.options.map(function(o){return o.label+': '+(o.note||'')}))+'</div>';
    if (d.rules && d.rules.length) b += '<div class="sec"><h4>The rules and numbers</h4>'+list(d.rules)+'</div>';
    if (d.goes_wrong && d.goes_wrong.length) b += '<div class="sec bad"><h4>What goes wrong</h4>'+list(d.goes_wrong)+'</div>';
    if (d.odd_cases && d.odd_cases.length) b += '<div class="sec"><h4>The odd ones</h4>'+list(d.odd_cases)+'</div>';
    if (d.source) b += '<div class="src">Where this came from: '+esc(d.source)+'</div>';
    panel.innerHTML = '<div class="ph"><span class="chip lime">'+esc(M.module?M.module.name+' map':'Process map')+'</span><button class="x" aria-label="Close">×</button></div>'
      + '<div class="pb">'+b+'</div>'
      + '<div class="pf"><button class="btn" id="pv"'+(i===0?' disabled':'')+'>← Back</button><button class="btn primary" id="nx"'+(i===steps.length-1?' disabled':'')+'>Next step →</button></div>';
    panel.querySelector('.x').onclick = close;
    panel.querySelector('#pv').onclick = function(){open(cur-1)};
    panel.querySelector('#nx').onclick = function(){open(cur+1)};
    (panel.querySelector('#nx:not([disabled])')||panel.querySelector('.x')).focus();
  }
  flow.addEventListener('click',function(e){var n=e.target.closest('.node');if(n)open(+n.dataset.i)});
  document.getElementById('walk').onclick = function(){open(0)};
  document.addEventListener('keydown',function(e){
    if (!panel) return;
    if (e.key==='Escape') close();
    else if (e.key==='ArrowRight') open(cur+1);
    else if (e.key==='ArrowLeft') open(cur-1);
  });
});
</script>

<!-- MAP DATA: replaced by fill_map.py. Everything above stays the same for every business. -->
<script type="application/json" id="map-data">
{}
</script>
</body>
</html>
